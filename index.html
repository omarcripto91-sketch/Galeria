<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Galería de Recuerdos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0c0d0e;
      --card-bg: #141618;
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #f5f5f7;
      --text-muted: #86868b;
      --accent: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
    }
    .app-container { width: 100%; max-width: 1120px; padding: 0 16px; }
    header {
      padding: 24px 0 16px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-bottom: 1px solid var(--border);
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .btn-share { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 7px 12px; border-radius: 999px; font: inherit; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .btn-share:hover { border-color: var(--text-muted); }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
    }
    .tag-pill span.dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
    .gallery-intro { display: flex; justify-content: space-between; align-items: flex-end; }
    .title-block h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; text-transform: capitalize; }
    .title-block p { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .btn-upload-direct {
      background: var(--accent);
      color: #000;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .btn-upload-direct:active { transform: scale(0.96); }
    #file-input { display: none; }
    .status-banner {
      width: 100%;
      max-width: 480px;
      margin: 12px auto 0 auto;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      text-align: center;
      display: none;
    }
    .status-banner.active { display: block; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; }
    .status-banner.error { display: block; background: rgba(239, 68, 68, 0.12); border: 1px solid #ef4444; color: #fecaca; }
    main { margin-top: 20px; }
    .gallery-feed { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .feed-item { min-width: 0; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .feed-item a { display: block; overflow: hidden; background: var(--card-bg); }
    .feed-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; transition: transform 180ms ease; }
    .feed-item a:hover img { transform: scale(1.025); }
    .feed-meta { padding: 8px 10px; font-size: 0.68rem; color: var(--text-muted); display: flex; justify-content: space-between; gap: 8px; }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 70px 20px; color: var(--text-muted); }
    .empty-state h2 { font-size: 1.1rem; color: var(--text-main); margin-bottom: 6px; }
    .empty-state p { font-size: 0.85rem; line-height: 1.4; }
    @media (max-width: 700px) { .gallery-feed { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="top-bar">
        <div class="tag-pill">
          <span class="dot"></span>
          <span id="tag-badge">NFC</span>
        </div>
        <div class="top-actions">
          <button type="button" class="btn-share" id="share-button">Copiar enlace</button>
        </div>
      </div>
      <div class="gallery-intro">
        <div class="title-block">
          <h1 id="gallery-title">Recuerdos</h1>
          <p id="photo-count">Cargando...</p>
        </div>
        <label for="file-input" class="btn-upload-direct" id="upload-label">
          <span id="btn-text">+ Subir fotos</span>
        </label>
        <input type="file" id="file-input" accept="image/*" multiple />
      </div>
    </header>
    <div id="status-bar" class="status-banner" role="status" aria-live="polite"></div>
    <main>
      <div id="gallery-container" class="gallery-feed"></div>
    </main>
  </div>
  <script>
    const SUPABASE_URL = "https://jpgtvezcifyvbjgbgrhb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_CM1RhO-Zk6RsCcKTgx-w2w_bj4ljrWZ";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const urlParams = new URLSearchParams(window.location.search);
    const tagId = (urlParams.get('id') || urlParams.get('tag') || 'recuerdo-demo').trim().toLowerCase();
    
    document.getElementById('tag-badge').textContent = tagId;
    document.getElementById('gallery-title').textContent = tagId.replace(/-/g, ' ').replace(/_/g, ' ');

    const fileInput = document.getElementById('file-input');
    const btnText = document.getElementById('btn-text');
    const uploadLabel = document.getElementById('upload-label');
    const statusBar = document.getElementById('status-bar');
    const galleryContainer = document.getElementById('gallery-container');
    const photoCountEl = document.getElementById('photo-count');
    let currentPhotos = [];
    let renderedObjectUrls = [];

    function openLocalDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('galeria-recuerdos', 1);
        request.onupgradeneeded = () => request.result.createObjectStore('fotos', { keyPath: 'id' });
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveLocalPhoto(file) {
      const database = await openLocalDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction('fotos', 'readwrite');
        transaction.objectStore('fotos').add({
          id: `${tagId}-${Date.now()}-${Math.random().toString(36).slice(2)}`,
          tag_id: tagId,
          created_at: new Date().toISOString(),
          blob: file
        });
        transaction.oncomplete = () => { database.close(); resolve(); };
        transaction.onerror = () => { database.close(); reject(transaction.error); };
        transaction.onabort = () => { database.close(); reject(transaction.error); };
      });
    }

    async function loadLocalPhotos() {
      const database = await openLocalDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction('fotos', 'readonly');
        const request = transaction.objectStore('fotos').getAll();
        request.onsuccess = () => resolve(request.result
          .filter(item => item.tag_id === tagId)
          .map(item => ({ ...item, url: URL.createObjectURL(item.blob), local: true })));
        request.onerror = () => reject(request.error);
        transaction.oncomplete = () => database.close();
        transaction.onerror = () => { database.close(); reject(transaction.error); };
      });
    }

    function showStatus(text, type = 'active') { statusBar.className = `status-banner ${type}`; statusBar.textContent = text; }
    function clearStatus() { statusBar.className = 'status-banner'; statusBar.textContent = ''; }

    document.getElementById('share-button').addEventListener('click', async () => {
      const galleryLink = new URL(window.location.href);
      galleryLink.searchParams.delete('tag');
      galleryLink.searchParams.set('id', tagId);
      try {
        await navigator.clipboard.writeText(galleryLink.href);
        showStatus('Enlace de esta galería copiado. Puedes guardarlo en el NFC.');
      } catch (err) {
        showStatus(`No se pudo copiar. Enlace para el NFC: ${galleryLink.href}`, 'error');
      }
    });

    async function fetchPhotos() {
      let cloudPhotos = [];
      let cloudError = null;
      try {
        const { data, error } = await supabase.from('fotos').select('*').eq('tag_id', tagId).order('created_at', { ascending: false });
        if (error) throw error;
        cloudPhotos = data || [];
      } catch (err) {
        cloudError = err;
      }
      try {
        const localPhotos = await loadLocalPhotos();
        currentPhotos = [...cloudPhotos, ...localPhotos].sort((first, second) => new Date(second.created_at) - new Date(first.created_at));
      } catch (err) {
        currentPhotos = cloudPhotos;
        if (!cloudError) cloudError = err;
      }
      renderGallery();
      if (cloudError) showStatus('No se pudo conectar con la nube. Se muestran las fotos guardadas en este navegador.', 'error');
    }

    function renderGallery() {
      renderedObjectUrls.forEach(url => URL.revokeObjectURL(url));
      renderedObjectUrls = [];
      photoCountEl.textContent = `${currentPhotos.length} ${currentPhotos.length === 1 ? 'fotografía' : 'fotografías'}`;
      galleryContainer.innerHTML = '';
      if (currentPhotos.length === 0) {
        galleryContainer.innerHTML = '<div class="empty-state"><h2>Tu galería está lista</h2><p>Sube fotos y volverán a aparecer aquí cuando regreses.</p></div>';
        return;
      }
      currentPhotos.forEach((item, index) => {
        const dateStr = item.created_at ? new Date(item.created_at).toLocaleDateString('es', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Recuerdo';
        const card = document.createElement('div');
        card.className = 'feed-item';
        const link = document.createElement('a');
        link.href = item.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.setAttribute('aria-label', `Abrir fotografía ${index + 1} en tamaño completo`);
        const image = document.createElement('img');
        image.src = item.url;
        image.alt = `Fotografía ${index + 1}`;
        image.loading = 'lazy';
        if (item.local) renderedObjectUrls.push(item.url);
        link.appendChild(image);
        const meta = document.createElement('div');
        meta.className = 'feed-meta';
        meta.textContent = `#${String(index + 1).padStart(2, '0')} · ${dateStr}${item.local ? ' · Solo en este navegador' : ''}`;
        card.append(link, meta);
        galleryContainer.appendChild(card);
      });
    }

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      const imageFiles = files.filter(file => file.type.startsWith('image/'));
      if (!imageFiles.length) {
        showStatus('Selecciona archivos de imagen para subir.', 'error');
        fileInput.value = '';
        return;
      }
      btnText.textContent = "Subiendo...";
      uploadLabel.style.opacity = "0.7";
      fileInput.disabled = true;
      showStatus(`Subiendo ${imageFiles.length} imagen(es)...`);
      let uploaded = 0;
      let savedLocally = 0;
      let uploadErrorMessage = '';
      for (let i = 0; i < imageFiles.length; i++) {
        const file = imageFiles[i];
        showStatus(`Subiendo ${i + 1} de ${imageFiles.length}...`);
        try {
          const ext = file.name.split('.').pop().replace(/[^a-zA-Z0-9]/g, '') || 'jpg';
          const filePath = `${tagId}/${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
          const { error: uploadError } = await supabase.storage.from('galerias').upload(filePath, file, { contentType: file.type || 'image/jpeg', upsert: false });
          if (uploadError) throw uploadError;
          const { data } = supabase.storage.from('galerias').getPublicUrl(filePath);
          const { error: insertError } = await supabase.from('fotos').insert([{ tag_id: tagId, url: data.publicUrl }]);
          if (insertError) throw insertError;
          uploaded++;
        } catch (err) {
          try {
            await saveLocalPhoto(file);
            uploaded++;
            savedLocally++;
          } catch (localError) {
            uploadErrorMessage = localError.message || err.message || 'Error desconocido';
          }
        }
      }
      btnText.textContent = "+ Subir fotos";
      uploadLabel.style.opacity = "1";
      fileInput.disabled = false;
      fileInput.value = '';
      if (uploaded > 0) {
        await fetchPhotos();
        const message = savedLocally > 0
          ? `${uploaded} imagen(es) guardada(s). ${savedLocally} solo en este navegador.`
          : `¡${uploaded} imagen(es) subida(s)!`;
        showStatus(uploaded === imageFiles.length ? message : `${message} ${uploadErrorMessage}`, uploaded === imageFiles.length && savedLocally === 0 ? 'active' : 'error');
      } else {
        showStatus('No se pudieron guardar las imágenes. ' + uploadErrorMessage, 'error');
      }
    });

    fetchPhotos();
  </script>
</body>
</html>
